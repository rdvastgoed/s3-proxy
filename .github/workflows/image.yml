name: Image

# Builds the s3-proxy image (dwello asset cache) on main.
# Pushes to Artifact Registry in rd-funnels-prod (europe-west4); Flux image
# automation picks the newest <unix-ts>-<sha> tag. CI builds and pushes; it
# never touches the cluster.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  REGISTRY: europe-west4-docker.pkg.dev
  IMAGE: europe-west4-docker.pkg.dev/rd-funnels-prod/production-s3-proxy/s3-proxy

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/337821077714/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-ci@rd-funnels-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "$REGISTRY" --quiet

      - id: tag
        run: echo "tag=$(date +%s)-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build -t "$IMAGE:${{ steps.tag.outputs.tag }}" .
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
